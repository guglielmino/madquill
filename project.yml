name: MadQuillQuickLook
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "12.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "52HSU26W4F"
    PRODUCT_BUNDLE_IDENTIFIER: it.little-endian.madquill
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MadQuillApp:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.little-endian.madquill
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "52HSU26W4F"
        CODE_SIGN_ENTITLEMENTS: MadQuillApp/MadQuillApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: MadQuillApp/Sources
      - path: MadQuillApp/Assets.xcassets
        buildPhase: resources
    info:
      path: MadQuillApp/Info.plist
      properties:
        CFBundleDisplayName: MadQuill
        CFBundleName: MadQuill
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
    dependencies:
      - target: MarkdownQuickLookExtension
        embed: true
  MarkdownQuickLookExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "12.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.little-endian.madquill.MarkdownQuickLookExtension
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "52HSU26W4F"
        CODE_SIGN_ENTITLEMENTS: MarkdownQuickLookExtension/MarkdownQuickLookExtension.entitlements
    sources:
      - path: MarkdownQuickLookExtension/Sources
    info:
      path: MarkdownQuickLookExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - public.markdown
              - net.daringfireball.markdown
schemes:
  MadQuillQuickLook:
    build:
      targets:
        MadQuillApp: all
