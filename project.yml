name: MadQuillQuickLook
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "12.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    PRODUCT_BUNDLE_IDENTIFIER: com.example.madquill
targets:
  MadQuillApp:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: MadQuillApp/Sources
    info:
      path: MadQuillApp/Info.plist
      properties:
        CFBundleDisplayName: MadQuill
        CFBundleName: MadQuill
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
    dependencies:
      - target: MarkdownQuickLookExtension
        embed: true
  MarkdownQuickLookExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: MarkdownQuickLookExtension/Sources
    info:
      path: MarkdownQuickLookExtension/Info.plist
schemes:
  MadQuillQuickLook:
    build:
      targets:
        MadQuillApp: all
